services:
  # ── PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cowork_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (실시간 서버용 Pub/Sub, 세션) ────────
  redis:
    image: redis:7-alpine
    container_name: cowork_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI REST API) ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cowork_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Realtime Server (WebSocket) ──────────────
  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    container_name: cowork_realtime
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./realtime:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── AI Chatbot ───────────────────────────────
  ai-chatbot:
    build:
      context: ./ai-chatbot
      dockerfile: Dockerfile
    container_name: cowork_ai_chatbot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - ./ai-chatbot:/app
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (React) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cowork_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - realtime

volumes:
  postgres_data:
