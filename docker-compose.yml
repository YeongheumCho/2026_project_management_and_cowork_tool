# 컨테이너 로그는 10MB 파일 3개까지만 남긴다. 제한이 없으면 오래 켜 둔 PC 의 디스크를 계속 차지한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cowork_db
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (실시간 서버용 Pub/Sub, 세션) ────────
  redis:
    image: redis:7-alpine
    container_name: cowork_redis
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI REST API) ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: surelog-backend:latest
    container_name: cowork_backend
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Realtime Server (WebSocket) ──────────────
  # 지금 화면에서 쓰지 않아 기본으로는 띄우지 않는다 (2026-10-16).
  # 필요하면: docker compose --profile realtime up -d
  realtime:
    profiles: ["realtime"]
    build:
      context: ./realtime
      dockerfile: Dockerfile
    image: surelog-realtime:latest
    container_name: cowork_realtime
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./realtime:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── AI Chatbot ───────────────────────────────
  ai-chatbot:
    build:
      context: ./ai-chatbot
      dockerfile: Dockerfile
    image: surelog-ai-chatbot:latest
    container_name: cowork_ai_chatbot
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./ai-chatbot:/app
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (React) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: surelog-frontend:latest
    container_name: cowork_frontend
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: cowork_caddy
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
