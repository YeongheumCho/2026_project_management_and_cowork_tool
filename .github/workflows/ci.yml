name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

# CLAUDE.md 의 "Verification Expectations" 를 자동화한 워크플로.
# 각 서비스는 독립 job 으로 돌아 한 서비스 실패가 다른 서비스 검증을 막지 않는다.
jobs:
  frontend:
    name: Frontend (lint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-test-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pytest (skip if no tests)
        run: |
          if find tests -name 'test_*.py' -type f 2>/dev/null | grep -q .; then
            pytest
          else
            echo "no test_*.py under tests/, skipping pytest"
          fi

  realtime:
    name: Realtime (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: realtime/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pytest (skip if no tests)
        run: |
          if find tests -name 'test_*.py' -type f 2>/dev/null | grep -q .; then
            pytest
          else
            echo "no test_*.py under tests/, skipping pytest"
          fi

  ai-chatbot:
    name: AI Chatbot (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-chatbot/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pytest (skip if no tests)
        run: |
          if find tests -name 'test_*.py' -type f 2>/dev/null | grep -q .; then
            pytest
          else
            echo "no test_*.py under tests/, skipping pytest"
          fi
